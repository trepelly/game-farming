<body><h2>🔍 MVP API Debug</h2>
<pre id="out">Testing...\n</pre>
<script>
const SUPABASE = 'https://pvydmytgmlrarwbozlnl.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2eWRteXRnbWxyYXJ3Ym96bG5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1OTE4MTEsImV4cCI6MjA2NzE2NzgxMX0.mV8hFCjHVC5Gmj1oZ6S5ZZOCr77tFGnoWltZ55dMINw';
const addr = '0xd3eb24b3231171615c94905c5066b78aa6a42829';
const out = document.getElementById('out');
const log = (msg,cls='') => { out.innerHTML += (cls?`<span class="${cls}">${msg}</span>`:msg)+'\n'; };
const H = {'apikey':KEY,'Authorization':'Bearer '+KEY};

async function run() {
  // Test exact URL formats
  const urls = [
    `${SUPABASE}/rest/v1/neso_wallet_daily?select=*&wallet=eq.${addr}&day=gte.2026-05-15&order=day.asc&limit=3`,
    `${SUPABASE}/rest/v1/neso_wallet_daily?select=*&wallet=eq.${addr}&order=day.desc&limit=3`,
  ];
  for (const url of urls) {
    log('\n🔍 ' + url.split('supabase.co')[1]);
    try {
      const r = await fetch(url, {headers:H});
      const text = await r.text();
      log('   HTTP ' + r.status, r.ok?'ok':'err');
      log('   ' + text.slice(0,400));
    } catch(e) { log('   X '+e.message,'err'); }
  }
  log('\nDone');
}
run();
</script></body></html>
