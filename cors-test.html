<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>MSU v11</title>
<style>body{font-family:monospace;background:#0d0d1a;color:#eee;padding:20px}
pre{background:#1c1c32;padding:12px;border-radius:8px;font-size:11px;white-space:pre-wrap;word-break:break-all}
.ok{color:#34d399}.err{color:#f87171}h2{color:#a78bfa}</style></head>
<body><h2>🔍 MSU Items v11</h2>
<pre id="out">Testing...\n</pre>
<script>
const addr = '0x3C7854d9EdB3a60DF46343A5C0F2D418ce7AE806';
const out  = document.getElementById('out');
const log  = (m,c='') => { out.innerHTML += (c?`<span class="${c}">${m}</span>`:m)+'\n'; };

const apiUrl = `https://msu.io/navigator/api/navigator/inventory/${addr}/items?requestType=RequestType_NftItem&location=Location_All&paginationParam.pageNo=1&paginationParam.pageSize=100`;

async function run() {
  log('Fetching items (raw text dump)...\n');
  const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(apiUrl)}`;
  try {
    const r = await fetch(proxyUrl);
    log('HTTP ' + r.status, r.ok?'ok':'err');
    const text = await r.text();
    log('Length: ' + text.length, 'ok');
    log('\n── RAW RESPONSE ──');
    log(text.slice(0, 3000).replace(/</g,'&lt;'));
  } catch(e) { log('Error: '+e.message,'err'); }
  log('\nDone');
}
run();
</script></body></html>
