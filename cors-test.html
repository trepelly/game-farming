<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Char detail</title>
<style>body{font-family:monospace;background:#0d0d1a;color:#eee;padding:20px}
pre{background:#1c1c32;padding:12px;border-radius:8px;font-size:11px;white-space:pre-wrap;word-break:break-all}</style></head>
<body><h2>Character full data (level/CP?)</h2><pre id="out">Testing...\n</pre>
<script>
const addr = '0x3C7854d9EdB3a60DF46343A5C0F2D418ce7AE806';
const WORKER = 'https://msu-proxy.petertrepellynguyen.workers.dev';
const out = document.getElementById('out');
const log = (m) => out.innerHTML += m+'\n';
async function run() {
  const url = `https://msu.io/navigator/api/navigator/inventory/${addr}/characters-v2?size=28`;
  const r = await fetch(`${WORKER}/?url=${encodeURIComponent(url)}`);
  const j = await r.json();
  const c = j.characters[0];
  log('Full first character object:');
  log(JSON.stringify(c, null, 2));
}
run();
</script></body></html>
