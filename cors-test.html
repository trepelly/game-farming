<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>msu.gg API Test</title>
<style>body{font-family:monospace;background:#0d0d1a;color:#eee;padding:20px;line-height:1.6}
pre{background:#1c1c32;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#34d399}.err{color:#f87171}h2{color:#a78bfa}</style></head>
<body><h2>🔍 msu.gg API Test</h2>
<pre id="out">Running...\n</pre>
<script>
const addr = '0x3C7854d9EdB3a60DF46343A5C0F2D418ce7AE806';
const out = document.getElementById('out');
const log = (msg,cls='') => { out.innerHTML += (cls?`<span class="${cls}">${msg}</span>`:msg)+'\n'; };

const tests = [
  `https://msu.gg/api/wallet-analytics?address=${addr}`,
  `https://msu.gg/api/wallet/${addr}/analytics`,
  `https://msu.gg/api/v1/wallet-analytics?wallet=${addr}`,
  `https://msu.gg/api/mvp?address=${addr}`,
  `https://msu.gg/api/wallet/${addr}/mvp`,
  `https://msu.gg/api/wallet/${addr}/spending`,
  `https://msu.gg/api/analytics/${addr}`,
];

async function run() {
  for (const url of tests) {
    log(`\n🔍 ${url}`);
    try {
      const r = await fetch(url, {headers:{'Accept':'application/json','Content-Type':'application/json'}});
      const text = await r.text();
      log(`   HTTP ${r.status}`, r.ok?'ok':'err');
      log(`   ${text.slice(0,300)}`);
    } catch(e) { log(`   ✗ ${e.message}`, 'err'); }
  }
  log('\n✅ Done');
}
run();
</script></body></html>
