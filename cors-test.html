<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Maplen Parse Test</title>
<style>body{font-family:monospace;background:#0d0d1a;color:#eee;padding:20px}
pre{background:#1c1c32;padding:12px;border-radius:8px;font-size:11px;white-space:pre-wrap;word-break:break-all}
.ok{color:#34d399}.err{color:#f87171}h2{color:#a78bfa}</style></head>
<body><h2>🔍 Maplen Parse Enhancement Currency</h2>
<pre id="out">Testing...\n</pre>
<script>
const addr = '0x015D115aEe484b66753F3485921f0F868Cd3cC0b';
const out  = document.getElementById('out');
const log  = (m,c='') => { out.innerHTML += (c?`<span class="${c}">${m}</span>`:m)+'\n'; };

const targetUrl = `https://maplen.gg/assets?address=${addr}`;
const proxyUrl  = `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`;

async function run() {
  log('Fetching ' + addr + ' ...\n');
  try {
    const r = await fetch(proxyUrl);
    const html = await r.text();
    log('HTML length: ' + html.length, 'ok');

    // Next.js apps embed data in __NEXT_DATA__ script or RSC payload
    // Look for the JSON data
    const nextDataMatch = html.match(/<script id="__NEXT_DATA__"[^>]*>(.*?)<\/script>/s);
    if (nextDataMatch) {
      log('\n✓ Found __NEXT_DATA__', 'ok');
      try {
        const data = JSON.parse(nextDataMatch[1]);
        log(JSON.stringify(data, null, 2).slice(0, 2000), 'ok');
      } catch(e) { log('Parse error: '+e.message, 'err'); }
    } else {
      log('\n✗ No __NEXT_DATA__ (app router RSC)', 'err');
    }

    // Search for currency values - look for patterns like "Power Crystal" followed by numbers
    log('\n── Searching currency values ──');
    const currencies = ['Power Crystal', 'Powerful Flame Points', 'Eternal Flame Points', 'Black Flame Points', 'NXPC', 'NESO'];
    currencies.forEach(cur => {
      const idx = html.indexOf(cur);
      if (idx !== -1) {
        // Look for numbers in nearby text (within 500 chars after)
        const chunk = html.slice(idx, idx+800);
        // Find number patterns
        const nums = chunk.match(/[\d,]+\.?\d*/g);
        log(`\n${cur}:`, 'ok');
        log('  nearby nums: ' + (nums ? nums.slice(0,5).join(', ') : 'none'));
      }
    });

    // Look for RSC streaming data (self.__next_f)
    log('\n── RSC payload search ──');
    const rscMatches = html.match(/self\.__next_f\.push\(\[1,"(.*?)"\]\)/gs);
    if (rscMatches) {
      log('Found ' + rscMatches.length + ' RSC chunks', 'ok');
      // Search chunks for crystal value
      const allRsc = rscMatches.join('');
      const crystalIdx = allRsc.indexOf('crystal');
      if (crystalIdx !== -1) {
        log('Crystal in RSC: ' + allRsc.slice(crystalIdx-50, crystalIdx+200).replace(/</g,'&lt;'), 'ok');
      }
    }

  } catch(e) { log('Error: '+e.message, 'err'); }
  log('\nDone');
}
run();
</script></body></html>
