<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Summary check</title>
<style>body{font-family:monospace;background:#0d0d1a;color:#eee;padding:20px}
pre{background:#1c1c32;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap}
.ok{color:#34d399}.err{color:#f87171}</style></head>
<body><h2>Summary fields check</h2><pre id="out">Testing...\n</pre>
<script>
const addr = '0x3C7854d9EdB3a60DF46343A5C0F2D418ce7AE806';
const WORKER = 'https://msu-proxy.petertrepellynguyen.workers.dev';
const out = document.getElementById('out');
const log = (m,c='') => out.innerHTML += (c?`<span class="${c}">${m}</span>`:m)+'\n';

async function run() {
  // Does summary have nft-in-wallet breakdown? Does FT summary exist?
  const url = `https://msu.io/navigator/api/navigator/inventory/${addr}/summary-v2`;
  const r = await fetch(`${WORKER}/?url=${encodeURIComponent(url)}`);
  const j = await r.json();
  log('FULL summary:', 'ok');
  log(JSON.stringify(j, null, 2));
  log('\nDone');
}
run();
</script></body></html>
