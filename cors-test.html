<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>MSU API Test</title>
<style>body{font-family:monospace;background:#0d0d1a;color:#eee;padding:20px;line-height:1.6}
pre{background:#1c1c32;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#34d399}.err{color:#f87171}h2{color:#a78bfa}</style></head>
<body><h2>🍁 MSU Open API Test</h2>
<p style="color:#6b6b8a">Wallet: 0x3C7854d9EdB3a60DF46343A5C0F2D418ce7AE806</p>
<pre id="out">Testing...
</pre>
<script>
const addr = '0x3C7854d9EdB3a60DF46343A5C0F2D418ce7AE806';
const out = document.getElementById('out');
const log = (msg,cls='')=>{out.innerHTML+=(cls?`<span class="${cls}">${msg}</span>`:msg)+'\n';};

const tests = [
  ['currencies (no key)', `https://openapi.msu.io/v1rc1/accounts/${addr}/currencies`, {}],
  ['currencies (with demo key)', `https://openapi.msu.io/v1rc1/accounts/${addr}/currencies`, {'x-nxopen-api-key':'demo'}],
  ['neso balance', `https://openapi.msu.io/v1rc1/accounts/${addr}/neso`, {}],
  ['characters', `https://openapi.msu.io/v1rc1/accounts/${addr}/characters`, {}],
];

async function run() {
  for(const [name,url,headers] of tests) {
    log(`\n🔍 ${name}`);
    try {
      const r = await fetch(url,{headers:{'Content-Type':'application/json',...headers}});
      const d = await r.json();
      log(`   HTTP ${r.status}`, r.ok?'ok':'err');
      log(`   ${JSON.stringify(d).slice(0,300)}`);
    } catch(e) { log(`   ✗ ${e.message}`,'err'); }
  }
  log('\n✅ Done');
}
run();
</script></body></html>
