<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>MSU Items Parse</title>
<style>body{font-family:monospace;background:#0d0d1a;color:#eee;padding:20px}
pre{background:#1c1c32;padding:12px;border-radius:8px;font-size:11px;white-space:pre-wrap;word-break:break-all}
.ok{color:#34d399}.err{color:#f87171}h2{color:#a78bfa}</style></head>
<body><h2>🔍 MSU Items Parse</h2>
<pre id="out">Testing...\n</pre>
<script>
const addr = '0x3C7854d9EdB3a60DF46343A5C0F2D418ce7AE806';
const out  = document.getElementById('out');
const log  = (m,c='') => { out.innerHTML += (c?`<span class="${c}">${m}</span>`:m)+'\n'; };

async function run() {
  // Try the actual API that navigator page calls
  // MSU navigator likely uses a GraphQL or REST API
  const apiTests = [
    `https://msu.io/marketplace/api/marketplace/items?walletAddress=${addr}`,
    `https://msu.io/api/items?owner=${addr}`,
    `https://msu.io/navigator/api/owner/${addr}/items`,
  ];

  // First parse the HTML we already can get
  const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent('https://msu.io/navigator/owner/'+addr+'?tab=items&page=1')}`;
  log('Fetching navigator HTML...\n');
  try {
    const r = await fetch(proxyUrl);
    const html = await r.text();
    log('HTML: ' + html.length + ' chars', 'ok');

    // Search for count/total patterns
    ['totalCount','itemCount','total','count','pageSize','totalElements'].forEach(key => {
      const re = new RegExp('"'+key+'"\\s*:\\s*(\\d+)', 'g');
      const matches = [...html.matchAll(re)];
      if (matches.length) {
        log(`\n${key}: ` + matches.map(m=>m[1]).slice(0,10).join(', '), 'ok');
      }
    });

    // Look for API endpoints embedded in JS
    log('\n── API endpoints in HTML ──');
    const apiUrls = [...html.matchAll(/https?:\/\/[^"'\s]*api[^"'\s]*/g)].map(m=>m[0]);
    const unique = [...new Set(apiUrls)].slice(0,15);
    unique.forEach(u => log('  ' + u.replace(/</g,'&lt;')));

    // Look for item token IDs (ERC721 tokenIds are long numbers)
    log('\n── Token IDs found ──');
    const tokenIds = [...html.matchAll(/"tokenId":\s*"?(\d{15,})"?/g)].map(m=>m[1]);
    log('  Count: ' + tokenIds.length, 'ok');
    if(tokenIds.length) log('  Sample: ' + tokenIds.slice(0,3).join(', '));

  } catch(e) { log('Error: '+e.message, 'err'); }

  log('\nDone');
}
run();
</script></body></html>
