<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>AVAX Balance Test</title>
<style>body{font-family:monospace;background:#0d0d1a;color:#eee;padding:20px;line-height:1.6}
pre{background:#1c1c32;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:#34d399}.err{color:#f87171}h2{color:#a78bfa}</style></head>
<body>
<h2>🔺 Avalanche Balance Test</h2>
<p style="color:#6b6b8a">Wallet: 0x3C7854d9EdB3a60DF46343A5C0F2D418ce7AE806</p>
<pre id="out">Testing...
</pre>
<script>
const addr = '0x3C7854d9EdB3a60DF46343A5C0F2D418ce7AE806';
const nxpc_contract = '0x5E0E90E268BC247Cc850c789A0DB0d5c7621fb59';
const out = document.getElementById('out');
const log = (msg, cls='') => { out.innerHTML += (cls?`<span class="${cls}">${msg}</span>`:msg)+'\n'; };

function h2d(hex, dec=18) {
  if(!hex || hex==='0x' || hex==='0x0') return 0;
  try { return Number(BigInt(hex) * BigInt(1000000) / BigInt('1'+'0'.repeat(dec))) / 1000000; } catch { return 0; }
}

async function run() {
  // Test 1: Routescan API (no CORS issues, public)
  log('\n🔍 Routescan API (tokenbalance)');
  try {
    const url = `https://api.routescan.io/v2/network/mainnet/evm/43114/etherscan/api?module=account&action=tokenbalance&contractaddress=${nxpc_contract}&address=${addr}&tag=latest&apikey=YourApiKeyToken`;
    const r = await fetch(url);
    const d = await r.json();
    log(`   HTTP ${r.status} | status: ${d.status} | result: ${d.result}`, r.ok?'ok':'err');
    if(d.result && d.result !== '0') log(`   NXPC(AVAX) = ${h2d('0x'+parseInt(d.result).toString(16))}`,'ok');
  } catch(e) { log(`   ✗ ${e.message}`, 'err'); }

  // Test 2: Avalanche RPC direct
  const rpcs = [
    'https://api.avax.network/ext/bc/C/rpc',
    'https://avalanche-c-chain-rpc.publicnode.com',
    'https://rpc.ankr.com/avalanche',
  ];
  const calldata = '0x70a08231' + '000000000000000000000000' + addr.slice(2).toLowerCase();
  for(const rpc of rpcs) {
    log(`\n🔍 RPC: ${rpc}`);
    try {
      const r = await fetch(rpc, {method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_call',params:[{to:nxpc_contract,data:calldata},'latest']})
      });
      const d = await r.json();
      log(`   HTTP ${r.status} | result: ${d.result}`, r.ok?'ok':'err');
      log(`   NXPC(AVAX) = ${h2d(d.result)}`, 'ok');
      break;
    } catch(e) { log(`   ✗ ${e.message}`, 'err'); }
  }
  log('\n✅ Done');
}
run();
</script></body></html>
