<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Maplen Proxy Test</title>
<style>body{font-family:monospace;background:#0d0d1a;color:#eee;padding:20px}
pre{background:#1c1c32;padding:12px;border-radius:8px;font-size:11px;white-space:pre-wrap;word-break:break-all}
.ok{color:#34d399}.err{color:#f87171}h2{color:#a78bfa}</style></head>
<body><h2>🔍 Maplen.gg via Proxy Test</h2>
<pre id="out">Testing...\n</pre>
<script>
const addr = '0x015D115aEe484b66753F3485921f0F868Cd3cC0b';
const out  = document.getElementById('out');
const log  = (m,c='') => { out.innerHTML += (c?`<span class="${c}">${m}</span>`:m)+'\n'; };

const targetUrl = `https://maplen.gg/assets?address=${addr}&tab=items`;

const proxies = [
  ['allorigins', `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`],
  ['corsproxy.io', `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`],
  ['codetabs', `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`],
];

// Also try maplen API endpoints via proxy
const apiUrl = `https://maplen.gg/api/assets/${addr}`;
const apiProxies = [
  ['allorigins-api', `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`],
];

async function run() {
  log('Target: ' + targetUrl + '\n');
  for (const [name, url] of [...proxies, ...apiProxies]) {
    log('\n🔍 ' + name);
    try {
      const r = await fetch(url);
      log('   HTTP ' + r.status, r.ok?'ok':'err');
      const text = await r.text();
      // Look for Power Crystal in the HTML/JSON
      const hasCrystal = text.includes('Power Crystal') || text.includes('crystal');
      const hasFlame = text.includes('Flame Points') || text.includes('flame');
      log('   Length: ' + text.length + ' | Crystal: ' + hasCrystal + ' | Flame: ' + hasFlame, hasCrystal?'ok':'');
      // Try to extract numbers near "Power Crystal"
      if (hasCrystal) {
        const idx = text.indexOf('Power Crystal');
        log('   Context: ' + text.slice(idx, idx+200).replace(/</g,'&lt;'), 'ok');
      }
      // Show first 300 chars
      log('   Preview: ' + text.slice(0,300).replace(/</g,'&lt;'));
    } catch(e) { log('   X ' + e.message, 'err'); }
  }
  log('\nDone');
}
run();
</script></body></html>
