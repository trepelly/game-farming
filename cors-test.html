<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>API CORS Test</title>
<style>
body{font-family:monospace;background:#0d0d1a;color:#eee;padding:20px;line-height:1.6}
pre{background:#1c1c32;padding:12px;border-radius:8px;overflow-x:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
h2{color:#a78bfa}.ok{color:#34d399}.err{color:#f87171}.info{color:#60a5fa}
</style></head>
<body>
<h2>🔬 API CORS Test v2</h2>
<p style="color:#6b6b8a">Testing character APIs from browser...</p>
<pre id="out">Running...
</pre>
<script>
const addr  = "0x3B4c2193bdd9bEE1aEbDF974a10cd4add33889D5";
const addr2 = "0x479a5734c905f2ab78bea832de149ee3075180ae";
const out = document.getElementById('out');
const log = (msg, cls='') => { out.innerHTML += (cls ? `<span class="${cls}">${msg}</span>` : msg) + '
'; };

const tests = [
  // xangle MSU explorer API
  ["xangle /accounts NFTs", `https://msu-explorer.xangle.io/api/v1/accounts/${addr2}/nfts`, "GET", null],
  ["xangle /accounts portfolio", `https://msu-explorer.xangle.io/api/v1/accounts/${addr2}/portfolio`, "GET", null],
  ["xangle /nfts by owner", `https://msu-explorer.xangle.io/api/v1/nfts?owner=${addr2}`, "GET", null],
  // Try with different path patterns
  ["xangle v2 accounts", `https://msu-explorer.xangle.io/api/v2/accounts/${addr2}/nfts`, "GET", null],
  // maplen with explicit CORS header
  ["maplen assets (no-cors)", `https://maplen.gg/api/trpc/wallet.getAssets?input=${encodeURIComponent(JSON.stringify({json:{address:addr}}))}`, "GET", null],
  // gamedatahub direct
  ["gamedatahub v1", `https://gamedatahub.msu.io/openapi/v1/character?ownerAddress=${addr}&limit=5`, "GET", null],
  // Henesys RPC - already works, get block to confirm
  ["Henesys RPC blockNumber", "https://henesys-rpc.msu.io", "POST", JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_blockNumber",params:[]})],
];

async function run() {
  for (const [name, url, method, body] of tests) {
    log(`
🔍 ${name}`);
    try {
      const opts = { method, headers: { "Content-Type": "application/json", "Accept": "application/json" } };
      if (body) opts.body = body;
      const r = await fetch(url, opts);
      const text = await r.text();
      log(`   HTTP ${r.status} | CORS: ${r.headers.get('access-control-allow-origin') || '(none)'}`, r.ok ? 'ok' : 'err');
      log(`   ${text.slice(0, 300)}`);
    } catch(e) {
      log(`   ✗ ${e.message}`, 'err');
    }
  }
  log('
✅ Done');
}
run();
</script>
</body></html>
