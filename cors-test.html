<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>MSU Navigator Test</title>
<style>body{font-family:monospace;background:#0d0d1a;color:#eee;padding:20px}
pre{background:#1c1c32;padding:12px;border-radius:8px;font-size:11px;white-space:pre-wrap;word-break:break-all}
.ok{color:#34d399}.err{color:#f87171}h2{color:#a78bfa}</style></head>
<body><h2>🔍 MSU Navigator NFT Count</h2>
<pre id="out">Testing...\n</pre>
<script>
const addr = '0x3C7854d9EdB3a60DF46343A5C0F2D418ce7AE806';
const out  = document.getElementById('out');
const log  = (m,c='') => { out.innerHTML += (c?`<span class="${c}">${m}</span>`:m)+'\n'; };

// MSU has an open API - try known endpoints
const tests = [
  ['msu api items', `https://msu.io/api/navigator/owner/${addr}?tab=items&page=1`],
  ['msu api v1', `https://api.msu.io/navigator/owner/${addr}/items`],
  ['msu marketplace', `https://msu.io/marketplace/api/v1/wallet/${addr}/items`],
  ['proxy navigator', `https://corsproxy.io/?url=${encodeURIComponent('https://msu.io/navigator/owner/'+addr+'?tab=items&page=1')}`],
];

async function run() {
  log('Wallet: ' + addr + '\n');
  for (const [name, url] of tests) {
    log('\n🔍 ' + name);
    try {
      const r = await fetch(url, {headers:{'Accept':'application/json'}});
      log('   HTTP ' + r.status, r.ok?'ok':'err');
      const text = await r.text();
      log('   Length: ' + text.length);
      // Look for totalCount or item count
      const tc = text.match(/"totalCount":\s*(\d+)/);
      const ic = text.match(/"itemCount":\s*(\d+)/);
      const items = text.match(/"items":\s*\[/);
      if (tc) log('   ✓ totalCount: ' + tc[1], 'ok');
      if (ic) log('   ✓ itemCount: ' + ic[1], 'ok');
      if (items) log('   ✓ has items array', 'ok');
      log('   Preview: ' + text.slice(0,250).replace(/</g,'&lt;'));
    } catch(e) { log('   X ' + e.message, 'err'); }
  }
  log('\nDone');
}
run();
</script></body></html>
